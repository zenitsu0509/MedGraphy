services:
  neo4j:
    image: neo4j:5-community
    container_name: medgraph-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env.local}
    volumes:
      - neo4j_local_data:/data
      - neo4j_local_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build: .
    container_name: medgraph-app
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env.local}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      AUTO_INGEST: ${AUTO_INGEST:-true}
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data/ayurveda:/app/data/ayurveda:ro
      - ./runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 5m

volumes:
  neo4j_local_data:
    name: medgraphy_neo4j_data
  neo4j_local_logs:
    name: medgraphy_neo4j_logs
